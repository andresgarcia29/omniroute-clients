name: Publish installer
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish stable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 0
          bash scripts/package-installer.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/install.sh"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/install.sh" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
